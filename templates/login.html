<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Campus Food Ordering System</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<header>
    <h1>Campus Food Ordering System</h1>
</header>

<div class="container">

    <h2>Welcome</h2>

    <div class="login-box">

        <h3>Admin Login</h3>

        {% if error %}
        <p class="error-message">
            {{ error }}
        </p>
        {% endif %}

        <form action="/admin-login" method="POST">

            <label>Admin ID</label>

            <input type="text"
                   name="admin_id"
                   required>

            <br><br>

            <label>Password</label>

            <input type="password"
                   name="password"
                   required>

            <br><br>

            <button type="submit">
                Login as Admin
            </button>

        </form>

        <hr>

        <h3>Customer</h3>

        <p>
            No account needed.
        </p>

        <a class="main-button"
           href="/guest">

            Continue as Guest

        </a>

    </div>

</div>

</body>

</html>
