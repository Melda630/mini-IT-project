{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-7 col-lg-5">

        <!-- Login heading -->
        <div class="text-center mb-4">

            <span class="badge bg-warning text-dark rounded-pill px-3 py-2 mb-3">
                ADMIN ACCESS
            </span>

            <h2 class="fw-bold text-dark">
                Admin Login ⚙️
            </h2>

            <p class="text-muted">
                Sign in to access the admin dashboard.
            </p>

        </div>


        <!-- Login card -->
        <div class="card border-0 shadow-sm rounded-4 overflow-hidden">

            <div class="card-header bg-dark text-white text-center border-0 p-4">

                <h4 class="fw-bold mb-1">
                    Campus Eats
                </h4>

                <small class="text-secondary">
                    Administrator Portal
                </small>

            </div>


            <div class="card-body p-4 p-md-5">

                {% if error %}

                <div class="alert alert-danger border-0 rounded-3 mb-4">
                    <strong>Login Failed</strong><br>
                    {{ error }}
                </div>

                {% endif %}


                <form action="{{ url_for('admin_login') }}"
                      method="POST">

                    <!-- Admin ID -->
                    <div class="mb-4">

                        <label class="form-label fw-semibold">
                            Admin ID
                        </label>

                        <input type="text"
                               name="admin_id"
                               class="form-control form-control-lg rounded-3"
                               placeholder="Enter Admin ID"
                               required>

                    </div>


                    <!-- Password -->
                    <div class="mb-4">

                        <label class="form-label fw-semibold">
                            Password
                        </label>

                        <input type="password"
                               name="password"
                               class="form-control form-control-lg rounded-3"
                               placeholder="Enter Password"
                               required>

                    </div>


                    <!-- Login button -->
                    <button type="submit"
                            class="btn btn-warning btn-lg w-100 rounded-3 fw-bold">
                        Login as Admin
                    </button>

                </form>

            </div>

        </div>


        <!-- Back button -->
        <div class="text-center mt-4">

            <a href="{{ url_for('home') }}"
               class="btn btn-outline-dark rounded-3 px-4">
                ← Back to Main Menu
            </a>

        </div>

    </div>

</div>

{% endblock %}
